[project]
name = "pengupool"
version = "0.9.2"
description = "Manage collaborating Claude Code and pi sessions: the shared backend for the VS Code/Cursor extension"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pengupool = "pengupool.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pengupool"]
