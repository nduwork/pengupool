[project]
name = "pengupool"
version = "0.6.0"
description = "Manage collaborating Claude Code and pi sessions: the shared backend for the VS Code/Cursor extension"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pengupool = "pengupool.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# hatchling honours only the root .gitignore, so `extension/.gitignore` did not keep the editor's
# node_modules out of the source distribution: every release shipped 5,130 of its files, 43 MB unpacked.
# The tutorial GIFs under docs/assets are 6 MB of media only the website reads. Both stay out.
exclude = ["extension/node_modules", "extension/out", "docs/assets"]

[tool.hatch.build.targets.wheel]
packages = ["pengupool"]
