[project]
name = "pengupool"
version = "1.0.0"
description = "Manage collaborating Claude Code and pi sessions: the shared backend for the VS Code/Cursor extension"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pengupool = "pengupool.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]  # skills/skill-repo/template/tests belongs to the generated repo, not to this suite

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pengupool"]
