[project]
name = "pengupool"
version = "1.1.1"
description = "Manage collaborating Claude Code and pi sessions: the shared backend for the VS Code/Cursor extension"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://pengupool.nduwork.com"
Repository = "https://github.com/nduwork/pengupool"
Changelog = "https://github.com/nduwork/pengupool/blob/main/CHANGELOG.md"

[project.scripts]
pengupool = "pengupool.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]  # skills/skill-repo/template/tests belongs to the generated repo, not to this suite

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pengupool"]
